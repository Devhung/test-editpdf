<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Editor Embed Example</title>
  <style>
    #pdf-editor-container {
      width: 100%;
      height: 90vh;
      border: none;
    }

    .controls {
      margin: 10px 0;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .language-select {
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
      margin-left: auto;
    }
  </style>
</head>

<body>
  <div class="controls">
    <input type="file" id="pdf-input" accept="application/pdf" />
    <select class="language-select" id="language-select">
      <option value="vi">Tiếng Việt</option>
      <option value="en">English</option>
    </select>
  </div>

  <iframe id="pdf-editor-container" src="http://localhost:53426"></iframe>

  <script>
    let editorReady = false;
    const editor = document.getElementById('pdf-editor-container');
    const pdfInput = document.getElementById('pdf-input');
    const languageSelect = document.getElementById('language-select');

    // Function to initialize editor with data
    function initEditorWithData(config) {
      if (!editorReady) return;

      editor.contentWindow.postMessage({
        type: 'INIT_DATA',
        data: {
          title: config.title || '',
          pdfFile: config.pdfFile,
          tools: {
            choosePDF: true,
            addImage: true,
            addText: true,
            addDrawing: true,
            addDate: {
              enabled: true,
              formats: [
                { label: "YYYY-MM-DD HH:mm", value: "YYYY-MM-DD HH:mm" },
                { label: "YYYY/MM/DD hh:mm A", value: "YYYY/MM/DD hh:mm A" },
                { label: "DD/MM/YYYY HH:mm", value: "DD/MM/YYYY HH:mm" },
                { label: "MM/DD/YYYY hh:mm A", value: "MM/DD/YYYY hh:mm A" },
                { label: "mm/dd/yyyy", value: "mm/dd/yyyy" },
                { label: "YYYY-MM-DD", value: "YYYY-MM-DD" },
                { label: "DD-MM-YYYY", value: "DD-MM-YYYY" },
                { label: "MM/DD/YYYY", value: "MM/DD/YYYY" },
                { label: "HH:mm", value: "HH:mm" },
                { label: "HH:mm", value: "HH:mm" },
                { label: "MMMM D, YYYY", value: "MMMM D, YYYY" },
              ],
              timezone: "5",
              defaultFormat: "mm/dd/yyyy HH:mm"
            },
            savePDF: true,
            patient: {
              showInfo: true,
              allowCreate: true,
            },
            allowDropFile: true
          },
          patientInfo: {
            fullName: config.patientInfo?.fullName || '',
            dateOfBirth: config.patientInfo?.dateOfBirth || ''
          },
          language: config.language || 'vi'
        }
      }, '*');
    }

    // Handle PDF file selection
    pdfInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        initEditorWithData({
          title: file.name,
          pdfFile: file,
          language: languageSelect.value
        });
      }
    });

    // Handle language change
    languageSelect.addEventListener('change', (e) => {
      initEditorWithData({
        language: e.target.value
      });
    });

    // Listen for editor ready message

      const { type, data } = event.data;

      if (type === 'EDITOR_READY') {
